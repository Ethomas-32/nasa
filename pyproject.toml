[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-trends"
version = "0.1.0"
description = "Trend detection for solar, wind and hydro resources from Earth science data"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "pandas",
    "pyyaml",
    "netCDF4",      # reading/writing the cached series and trend files
    "dask",         # lazy coarsening in loaders
    "pillow",       # PNG overlays (export)
    "jsonschema",   # export schema validation
]

[project.optional-dependencies]
dev = ["pytest"]
data = ["earthaccess>=0.19", "pystac-client>=0.9", "planetary-computer>=1.0", "zarr>=3.4", "fsspec", "s3fs",
        "adlfs", "aiohttp", "requests", "h5netcdf", "h5py", "rasterio>=1.5", "pyproj>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
