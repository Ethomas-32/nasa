# Regions are configuration, not code (CLAUDE.md section 2).
# coverage_tags: which provider coverage tags this region can use.
# provider_preference: ordered; the registry picks the first provider that a variable lists with a
# coverage tag the region has. Regional products give in-region depth; for cross-region comparison
# use `resolve(..., global_only=True)`.
# Bounding boxes are approximate working extents (not verified against any boundary dataset).
regions:
  conus:
    name: Contiguous United States
    bbox: {lat_min: 24.5, lat_max: 49.5, lon_min: -125.0, lon_max: -66.5}
    coverage_tags: [global, north_america, conus]
    analysis_deg: 0.25   # products finer than this are block-averaged to it (cheap stats, small cache)
    mask: data/masks/conus_nclimgrid_footprint.nc   # US land only (bbox also covers ocean, Canada, Mexico); scripts/make_mask.py
    provider_preference: [daymet, nclimgrid, terraclimate, merra2, nasa_power]
    subregions:            # simple named boxes for summaries and alert locations (not official regions)
      Southwest:  {lat_min: 31.0, lat_max: 37.0, lon_min: -120.0, lon_max: -103.0}
      Northeast:  {lat_min: 38.0, lat_max: 47.5, lon_min: -85.0,  lon_max: -67.0}
      Pacific NW: {lat_min: 42.0, lat_max: 49.0, lon_min: -125.0, lon_max: -116.0}
      Southeast:  {lat_min: 29.0, lat_max: 36.0, lon_min: -92.0,  lon_max: -76.0}
      N. Rockies: {lat_min: 42.0, lat_max: 49.0, lon_min: -116.0, lon_max: -104.0}
      Plains:     {lat_min: 35.0, lat_max: 48.0, lon_min: -104.0, lon_max: -95.0}
  africa:
    name: Africa
    bbox: {lat_min: -35.0, lat_max: 38.0, lon_min: -18.0, lon_max: 52.0}
    coverage_tags: [global, africa]
    analysis_deg: 0.5
    provider_preference: [terraclimate, merra2, nasa_power]
    notes: Sparse station network; state uncertainty. No land mask yet (bbox includes ocean, Middle East, southern Europe edge).
  global:
    name: Global (coarse, for the globe overview)
    bbox: {lat_min: -90.0, lat_max: 90.0, lon_min: -180.0, lon_max: 180.0}
    coverage_tags: [global]
    analysis_deg: 1.0
    provider_preference: [terraclimate, merra2, nasa_power]
