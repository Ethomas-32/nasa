# Verified in Phase 2 on 2026-11-14; evidence and caveats in docs/sources.md.
# `status: verified` means every provider entry below was checked against the live service
# (dataset id, native variable name, units, grid, time coverage). Coverage periods move: "end" is
# the last month seen on the check date.
#
# theme:       hydrology | cryosphere | atmospheric_dynamics | atmospheric_chemistry
# resource:    solar | wind | hydro | none
# audience:    subset of [energy, agriculture]
# units:       our canonical units (loaders convert from `native_units`)
# aggregation: how monthly values combine into a year/season (sum | mean | max)
# relative:    true if a ratio scale makes "percent change" meaningful
# providers:   ordered list of {provider, coverage, dataset, variable, native_units, period, grid,
#              product_type}. `dataset` is the store/collection id the loader opens.
# derived:     {function, inputs} instead of providers (see derived.py)
# primary:     true for exactly one headline index per resource (solar, wind, hydro)
# seasonal:    false to skip per-season runs (default true)
variables:
  solar_irradiance:
    long_name: All-sky surface shortwave downward irradiance
    theme: atmospheric_chemistry   # judgment call: aerosol/cloud attenuation drives the trend
    resource: solar
    audience: [energy, agriculture]
    units: W m-2
    aggregation: mean
    relative: true
    primary: true      # the resource's headline index (portfolio analysis)
    status: verified
    caveats:
      - Reanalysis, not a site measurement.
      - "POWER's 1984-present solar series splices SRB (to 2000) and SYN1deg (from 2001) with a +1.5% step; not used for trends. See docs/sources.md."
    providers:
      - {provider: merra2, coverage: [global], dataset: M2TMNXRAD, variable: SWGDN, native_units: W m-2,
         period: ["1980-01", "2026-09"], grid: "0.5x0.625 deg", product_type: reanalysis}
      - {provider: nasa_power, coverage: [global], dataset: "s3://nasa-power/syn1deg/temporal/power_syn1deg_monthly_temporal_utc.zarr",
         variable: ALLSKY_SFC_SW_DWN, native_units: W m-2, period: ["2001-01", "2026-08"], grid: "1 deg",
         product_type: satellite_derived, note: cross-check only, record too short for the common period}

  aerosol_optical_depth:
    long_name: Total aerosol extinction optical thickness (550 nm)
    theme: atmospheric_chemistry
    resource: solar
    audience: [energy]
    units: "1"
    aggregation: mean
    relative: true
    status: verified
    caveats: [Reanalysis aerosol that assimilates satellite AOD; observing-system changes can cause discontinuities.]
    providers:
      - {provider: merra2, coverage: [global], dataset: M2TMNXAER, variable: TOTEXTTAU, native_units: "1",
         period: ["1980-01", "2026-09"], grid: "0.5x0.625 deg", product_type: reanalysis}

  air_temp_2m:
    long_name: Air temperature at 2 m
    theme: atmospheric_dynamics
    resource: none
    audience: [energy, agriculture]
    units: degC
    aggregation: mean
    relative: false
    status: verified
    providers:
      - {provider: nasa_power, coverage: [global], dataset: "s3://nasa-power/merra2/temporal/power_merra2_monthly_temporal_utc.zarr",
         variable: T2M, native_units: C, period: ["1981-01", "2026-09"], grid: "0.5x0.625 deg", product_type: reanalysis}

  surface_pressure:
    long_name: Surface pressure
    theme: atmospheric_dynamics
    resource: none
    audience: [energy]
    units: hPa
    aggregation: mean
    relative: true
    status: verified
    providers:
      - {provider: nasa_power, coverage: [global], dataset: "s3://nasa-power/merra2/temporal/power_merra2_monthly_temporal_utc.zarr",
         variable: PS, native_units: hPa, period: ["1981-01", "2026-09"], grid: "0.5x0.625 deg", product_type: reanalysis}

  wind_speed_50m:
    long_name: Wind speed at 50 m
    theme: atmospheric_dynamics
    resource: wind
    audience: [energy]
    units: m s-1
    aggregation: mean
    relative: true
    status: verified
    caveats: [Reanalysis, not a site measurement.]
    providers:
      - {provider: nasa_power, coverage: [global], dataset: "s3://nasa-power/merra2/temporal/power_merra2_monthly_temporal_utc.zarr",
         variable: WS50M, native_units: m/s, period: ["1981-01", "2026-09"], grid: "0.5x0.625 deg", product_type: reanalysis}

  wind_speed_cubed_50m:
    long_name: Monthly mean of daily-mean 50 m wind speed cubed
    theme: atmospheric_dynamics
    resource: wind
    audience: [energy]
    units: m3 s-3
    aggregation: mean
    relative: true
    status: verified
    caveats: [Built from DAILY mean speeds; sub-daily variability is not captured.]
    providers:
      - {provider: nasa_power, coverage: [global], dataset: "s3://nasa-power/merra2/temporal/power_merra2_daily_temporal_utc.zarr",
         variable: WS50M, native_units: m3 s-3, transform: monthly_mean_of_daily_cube,
         period: ["1981-01", "2026-09"], grid: "0.5x0.625 deg", product_type: reanalysis}

  wind_power_density:
    long_name: Wind power density proxy (0.5 * rho * mean daily v^3)
    theme: atmospheric_dynamics
    resource: wind
    audience: [energy]
    units: W m-2
    aggregation: mean
    relative: true
    primary: true      # the resource's headline index (portfolio analysis)
    status: verified
    caveats:
      - "Uses the monthly mean of DAILY v^3. Cubing monthly-mean speed instead underestimated it by 29% (median) and changed the 2010-2019 trend (-0.96 vs -0.65 %/yr) in a Great Plains test box; daily is still lower than an hourly-based value."
      - Proxy only; dry-air density, ignores humidity and turbine characteristics.
    derived:
      function: wind_power_density_from_cube
      inputs: [wind_speed_cubed_50m, air_temp_2m, surface_pressure]

  runoff:
    long_name: Runoff (water-balance model)
    theme: hydrology
    resource: hydro
    audience: [energy, agriculture]
    units: mm
    aggregation: sum
    relative: true
    primary: true      # the resource's headline index (portfolio analysis)
    status: verified
    caveats:
      - Resource proxy, not generation; dams and operations are not modeled.
      - Model-based water balance product; PC copy ends 2021-12.
    providers:
      - {provider: terraclimate, coverage: [global], dataset: terraclimate, variable: q, native_units: mm,
         period: ["1958-01", "2021-12"], grid: "1/24 deg", product_type: model}

  precipitation:
    long_name: Precipitation
    theme: hydrology
    resource: hydro
    audience: [energy, agriculture]
    units: mm
    aggregation: sum
    relative: true
    status: verified
    caveats: [PC copies end 2022-09 (NClimGrid) / 2021-12 (TerraClimate).]
    providers:
      - {provider: nclimgrid, coverage: [conus], dataset: noaa-nclimgrid-monthly, variable: prcp, native_units: mm,
         period: ["1895-01", "2022-09"], grid: "1/24 deg", product_type: gridded_observation}
      - {provider: terraclimate, coverage: [global], dataset: terraclimate, variable: ppt, native_units: mm,
         period: ["1958-01", "2021-12"], grid: "1/24 deg", product_type: model}

  soil_moisture:
    long_name: Soil moisture
    theme: hydrology
    resource: hydro
    audience: [agriculture, energy]
    units: mm
    aggregation: mean
    relative: true
    status: verified
    providers:
      - {provider: terraclimate, coverage: [global], dataset: terraclimate, variable: soil, native_units: mm,
         period: ["1958-01", "2021-12"], grid: "1/24 deg", product_type: model}

  pdsi:
    long_name: Palmer Drought Severity Index
    theme: hydrology
    resource: hydro
    audience: [agriculture]
    units: "1"
    aggregation: mean
    relative: false
    status: verified
    providers:
      - {provider: terraclimate, coverage: [global], dataset: terraclimate, variable: pdsi, native_units: unitless,
         period: ["1958-01", "2021-12"], grid: "1/24 deg", product_type: model}

  snow_water_equivalent:
    long_name: Snow water equivalent
    theme: cryosphere
    resource: hydro
    audience: [energy, agriculture]
    units: mm
    aggregation: max   # peak SWE per year is the usual hydro-relevant statistic
    seasonal: false    # a seasonal peak-SWE trend (e.g. JJA) is not meaningful; annual only
    relative: true
    status: verified
    caveats:
      - "Daymet monthly swe is the monthly MEAN of daily SWE (verified against daymet-daily-na despite 'monthly total' metadata). Annual value = peak monthly-mean SWE, a lower bound on true peak SWE."
      - Daymet is on a 1 km Lambert conformal grid and needs reprojection.
    providers:
      - {provider: daymet, coverage: [conus], dataset: daymet-monthly-na, variable: swe, native_units: mm,
         period: ["1980-01", "2020-12"], grid: "1 km LCC", product_type: gridded_observation}
      - {provider: terraclimate, coverage: [global], dataset: terraclimate, variable: swe, native_units: mm,
         period: ["1958-01", "2021-12"], grid: "1/24 deg", product_type: model}
