# EVERYTHING HERE IS `status: unverified` UNTIL PHASE 2 (CLAUDE.md section 10).
# Provider variable names, units and product types below are CANDIDATES taken from CLAUDE.md
# section 3 or common knowledge; none has been checked against a live service.
#
# theme:       hydrology | cryosphere | atmospheric_dynamics | atmospheric_chemistry
# resource:    solar | wind | hydro | none
# audience:    subset of [energy, agriculture]
# aggregation: how monthly values combine into a year/season (sum | mean | max)
# relative:    true if a ratio scale makes "percent change" meaningful
# providers:   ordered list of {provider, coverage, variable, product_type}
# derived:     {function, inputs} instead of providers (see derived.py)
variables:
  solar_irradiance:
    long_name: All-sky surface shortwave downward irradiance
    theme: atmospheric_chemistry   # judgment call: aerosol/cloud attenuation drives the trend
    resource: solar
    audience: [energy, agriculture]
    units: kWh m-2 day-1
    aggregation: mean
    relative: true
    status: unverified
    caveats: [Reanalysis/satellite-assimilated product, not a site measurement.]
    providers:
      - {provider: nasa_power, coverage: [global], variable: ALLSKY_SFC_SW_DWN, product_type: reanalysis}

  aerosol_optical_depth:
    long_name: Total aerosol extinction optical depth (550 nm)
    theme: atmospheric_chemistry
    resource: solar
    audience: [energy]
    units: "1"
    aggregation: mean
    relative: true
    status: unverified
    caveats: [Reanalysis aerosol, assimilates satellite AOD.]
    providers:
      - {provider: merra2, coverage: [global], variable: TOTEXTTAU, product_type: reanalysis}

  air_temp_2m:
    long_name: Air temperature at 2 m
    theme: atmospheric_dynamics
    resource: none
    audience: [energy, agriculture]
    units: degC
    aggregation: mean
    relative: false
    status: unverified
    providers:
      - {provider: nasa_power, coverage: [global], variable: T2M, product_type: reanalysis}

  surface_pressure:
    long_name: Surface pressure
    theme: atmospheric_dynamics
    resource: none
    audience: [energy]
    units: kPa
    aggregation: mean
    relative: true
    status: unverified
    providers:
      - {provider: nasa_power, coverage: [global], variable: PS, product_type: reanalysis}

  wind_speed_50m:
    long_name: Wind speed at 50 m
    theme: atmospheric_dynamics
    resource: wind
    audience: [energy]
    units: m s-1
    aggregation: mean
    relative: true
    status: unverified
    caveats: [Reanalysis, not a site measurement.]
    providers:
      - {provider: nasa_power, coverage: [global], variable: WS50M, product_type: reanalysis}

  wind_power_density:
    long_name: Wind power density proxy (0.5 * rho * v^3)
    theme: atmospheric_dynamics
    resource: wind
    audience: [energy]
    units: W m-2
    aggregation: mean
    relative: true
    status: unverified
    caveats:
      - Computed from time-mean speed, which underestimates true mean power density (E[v^3] > E[v]^3).
      - Proxy only; ignores humidity and turbine characteristics.
    derived:
      function: wind_power_density
      inputs: [wind_speed_50m, air_temp_2m, surface_pressure]

  runoff:
    long_name: Runoff (water-balance model)
    theme: hydrology
    resource: hydro
    audience: [energy, agriculture]
    units: mm
    aggregation: sum
    relative: true
    status: unverified
    caveats: [Resource proxy, not generation; dams and operations are not modeled., Model-based water balance product.]
    providers:
      - {provider: terraclimate, coverage: [global], variable: q, product_type: model}

  precipitation:
    long_name: Precipitation
    theme: hydrology
    resource: hydro
    audience: [energy, agriculture]
    units: mm
    aggregation: sum
    relative: true
    status: unverified
    providers:
      - {provider: nclimgrid, coverage: [conus], variable: null, product_type: gridded_observation}
      - {provider: terraclimate, coverage: [global], variable: ppt, product_type: model}

  soil_moisture:
    long_name: Soil moisture
    theme: hydrology
    resource: hydro
    audience: [agriculture, energy]
    units: mm
    aggregation: mean
    relative: true
    status: unverified
    providers:
      - {provider: terraclimate, coverage: [global], variable: soil, product_type: model}

  pdsi:
    long_name: Palmer Drought Severity Index
    theme: hydrology
    resource: hydro
    audience: [agriculture]
    units: "1"
    aggregation: mean
    relative: false
    status: unverified
    providers:
      - {provider: terraclimate, coverage: [global], variable: PDSI, product_type: model}

  snow_water_equivalent:
    long_name: Snow water equivalent
    theme: cryosphere
    resource: hydro
    audience: [energy, agriculture]
    units: kg m-2
    aggregation: max   # peak SWE per year is the usual hydro-relevant statistic
    relative: true
    status: unverified
    caveats: [Daymet is CONUS-only; no global provider listed yet.]
    providers:
      - {provider: daymet, coverage: [conus], variable: swe, product_type: gridded_observation}
